name: E2E Tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:

concurrency:
  group: e2e-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: macos-latest # TODO: use ubuntu-latest once open sourced
    name: E2E Tests
    env:
      EXTERNAL_SFU_URL: ${{ vars.EXTERNAL_SFU_URL }}

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Add to Hosts
        run: echo "127.0.0.1 meet.test" | sudo tee -a /etc/hosts

      - name: Install System Dependencies
        run: |
          brew install coreutils redis mariadb

      - name: Start Redis Servers
        run: |
          # Start Redis for cache on port 13000
          redis-server --port 13000 --daemonize yes
          # Start Redis for queue on port 11000
          redis-server --port 11000 --daemonize yes
          # Verify Redis servers are running
          redis-cli -p 13000 ping
          redis-cli -p 11000 ping

      - name: Start MariaDB
        run: |
          # Start MariaDB
          brew services start mariadb
          # Wait for MariaDB to be ready
          for i in {1..30}; do
            if mysqladmin ping --silent 2>/dev/null; then
              echo "MariaDB is ready!"
              break
            fi
            echo "Waiting for MariaDB... ($i/30)"
            sleep 2
          done
          # Configure root user for password authentication (use sudo for unix_socket auth)
          sudo mysql -u root <<EOF
          ALTER USER 'root'@'localhost' IDENTIFIED VIA mysql_native_password USING PASSWORD('root');
          CREATE USER IF NOT EXISTS 'root'@'127.0.0.1' IDENTIFIED BY 'root';
          GRANT ALL PRIVILEGES ON *.* TO 'root'@'localhost' WITH GRANT OPTION;
          GRANT ALL PRIVILEGES ON *.* TO 'root'@'127.0.0.1' WITH GRANT OPTION;
          FLUSH PRIVILEGES;
          EOF
          echo "MariaDB configured!"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Get npm cache directory path
        id: npm-cache-dir-path
        run: 'echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Additional Dependencies
        run: |
          brew install ffmpeg

      - name: Setup Bench
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install Meet
        working-directory: /Users/runner/frappe-bench
        run: |
          bench get-app meet $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin meet.test
          bench --site meet.test install-app meet
          bench build
        env:
          CI: "Yes"

      - name: Configure Site for E2E
        working-directory: /Users/runner/frappe-bench
        run: |
          if [ -n "$EXTERNAL_SFU_URL" ]; then
             echo "Using External SFU: $EXTERNAL_SFU_URL"
             SFU_URL="$EXTERNAL_SFU_URL"
             SFU_PORT=$(python3 -c "from urllib.parse import urlparse; u = urlparse('$SFU_URL'); print(u.port or (443 if u.scheme == 'https' else 80))")
          else
             echo "Using Local SFU"
             SFU_URL="http://localhost"
             SFU_PORT="3000"
          fi

          bench --site meet.test set-config sfu_secret "e2e-test-secret-key-12345"
          bench --site meet.test set-config sfu_server_url "$SFU_URL"
          bench --site meet.test set-config sfu_server_port "$SFU_PORT"
          bench --site meet.test set-config allow_tests true
          bench --site meet.test set-config host_name "http://meet.test:8000"
          
          # Create test users
          bench --site meet.test execute meet.utils.test_helpers.create_test_users

      - name: Build SFU Server
        if: env.EXTERNAL_SFU_URL == ''
        working-directory: ${{ github.workspace }}/sfu-server
        run: |
          npm ci
          npm run build

      - name: Install E2E Dependencies
        working-directory: ${{ github.workspace }}/e2e
        run: |
          yarn install --frozen-lockfile
          yarn playwright install chromium --with-deps

      - name: Generate Fake Audio File
        working-directory: ${{ github.workspace }}/e2e/resources
        run: |
          ffmpeg -f lavfi -i anullsrc=r=44100:cl=mono -t 10 -q:a 9 -acodec pcm_s16le fake-audio.wav

      - name: Generate Fake Video File
        working-directory: ${{ github.workspace }}/e2e/resources
        run: |
          ffmpeg -f lavfi -i testsrc=size=640x480:rate=30 -t 10 -pix_fmt yuv420p fake-video.y4m

      - name: Start Frappe Server
        working-directory: /Users/runner/frappe-bench
        run: |
          sed -i '' 's/^watch:/# watch:/g' Procfile
          sed -i '' 's/^schedule:/# schedule:/g' Procfile
          bench start &> bench_start.log &
          echo "Waiting for Frappe server to start..."
          gtimeout 60 bash -c 'until curl -s http://meet.test:8000 > /dev/null; do sleep 2; done' || timeout 60 bash -c 'until curl -s http://meet.test:8000 > /dev/null; do sleep 2; done'
          echo "Frappe server is ready!"

      - name: Start SFU Server
        if: env.EXTERNAL_SFU_URL == ''
        working-directory: ${{ github.workspace }}/sfu-server
        run: |
          npm start &
          echo "Waiting for SFU server..."
          gtimeout 30 bash -c 'until curl -s http://localhost:3000/health > /dev/null 2>&1; do sleep 2; done' || timeout 30 bash -c 'until curl -s http://localhost:3000/health > /dev/null 2>&1; do sleep 2; done'
          echo "SFU server is ready"
        env:
          PORT: 3000
          HOST: 0.0.0.0
          JWT_SECRET: e2e-test-secret-key-12345
          MEDIASOUP_ANNOUNCED_IP: 127.0.0.1
          MEDIASOUP_NUM_WORKERS: 1

      - name: Run E2E Tests
        working-directory: ${{ github.workspace }}/e2e
        run: yarn test
        env:
          BASE_URL: http://meet.test:8000
          SFU_URL: ${{ env.EXTERNAL_SFU_URL || 'http://localhost:3000' }}
          CI: true

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
